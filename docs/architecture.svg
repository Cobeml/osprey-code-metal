<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="664" viewBox="0 0 1390 664" role="img" aria-label="Four field devices feed the ground Pi: the water sensor and deck camera over USB, the rover over the wired switch or a Cloudflare tunnel, and a phone acting as the UAV proxy through the tunnel. Inside the Pi, ingest feeds Hailo perception, which feeds the auto-MOB trigger and the incident state machine; the incident drives drift, rover commands, the SQLite log and the coordinator gateway, which reaches the Mac browser over wired Ethernet.">
  <style>
svg{--bg:#ffffff;--zone:#e1e8ec;--ink:#13232d;--muted:#566771;--line:#aebcc4;--accent:#c8440e;color:var(--ink);font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--zone:#101d24;--ink:#dce6ea;--muted:#93a5ae;--line:#3b4f5a;--accent:#ff7b40}}
.bgr{fill:var(--bg)}
.zone{fill:var(--zone);stroke:var(--line)}
.bx{fill:var(--bg);stroke:var(--line);stroke-width:1.2}
.bx-dev{fill:var(--bg);stroke:currentColor;stroke-width:1.2}
.pill{fill:var(--zone);stroke:currentColor;stroke-width:1;stroke-dasharray:3 3}
.t{fill:currentColor;font-size:11.5px}
.tb{fill:currentColor;font-size:13px;font-weight:600}
.tm{fill:var(--muted);font-size:11px}
.code{fill:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px}
.lab{fill:var(--muted);font-size:10.5px}
.zt{fill:currentColor;font-size:15px;font-weight:600}
.ar{stroke:currentColor;stroke-width:1.3;fill:none}
.ar-dash{stroke:currentColor;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.ar-acc{stroke:var(--accent);stroke-width:2.2;fill:none}
.acc{fill:var(--accent)}
.acc-t{fill:var(--accent);font-size:11px;font-weight:600}
.head{fill:currentColor}
</style>
<rect class="bgr" x="0" y="0" width="1390" height="664"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker>
  </defs>

  <!-- Ground processor zone -->
  <rect class="zone" x="380" y="12" width="750" height="640" rx="6"/>
  <text class="zt" x="400" y="36">Ground processor · Raspberry Pi 5 + Hailo-8 · FastAPI :8000</text>

  <!-- Field devices -->
  <text class="zt" x="20" y="34">In the field</text>
  <rect class="bx-dev" x="20" y="50" width="230" height="60" rx="4"/>
  <text class="tb" x="34" y="73">Grove water sensor</text>
  <text class="tm" x="34" y="92">Seeeduino D5 · wet / dry</text>

  <rect class="bx-dev" x="20" y="140" width="230" height="76" rx="4"/>
  <text class="tb" x="34" y="163">Ship deck camera</text>
  <text class="tm" x="34" y="182">Deptrum Aurora 930 RGB-D</text>
  <text class="tm" x="34" y="199">640×400 · depth 0.3–3 m</text>

  <rect class="bx-dev" x="20" y="255" width="230" height="120" rx="4"/>
  <text class="tb" x="34" y="278">Scout B · TurboPi rover</text>
  <text class="tm" x="34" y="296">own Pi 5 locks on the green ball</text>
  <text class="tm" x="34" y="312">dispatch → search → approach</text>
  <text class="tm" x="34" y="328">→ on scene, then follows</text>
  <text class="tm" x="34" y="344">60 s on its own if link drops</text>
  <text class="tm" x="34" y="360">UWB range to beacon (trial)</text>

  <rect class="bx-dev" x="20" y="440" width="230" height="96" rx="4"/>
  <text class="tb" x="34" y="463">Scout A · UAV proxy (phone)</text>
  <text class="tm" x="34" y="481">phone camera stands in for</text>
  <text class="tm" x="34" y="497">the drone's view from above</text>
  <text class="tm" x="34" y="513">/scout page, HTTPS via tunnel</text>
  <text class="tm" x="34" y="529">labeled “UAV proxy” on screen</text>

  <!-- Field → ingest links -->
  <line class="ar" x1="250" y1="80" x2="398" y2="80" marker-end="url(#a)"/>
  <text class="lab" x="320" y="73" text-anchor="middle">USB serial · 4 Hz</text>
  <line class="ar" x1="250" y1="178" x2="398" y2="178" marker-end="url(#a)"/>
  <text class="lab" x="320" y="171" text-anchor="middle">USB 2.0 · 14.5 fps</text>
  <line class="ar" x1="250" y1="285" x2="398" y2="285" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lab" x="322" y="278" text-anchor="middle">Ethernet when docked</text>
  <line class="ar-dash" x1="252" y1="352" x2="268" y2="402" marker-start="url(#a)"/>
  <text class="lab" x="268" y="368">Wi-Fi</text>
  <line class="ar-dash" x1="252" y1="458" x2="268" y2="418" marker-start="url(#a)"/>
  <text class="lab" x="272" y="452">Wi-Fi / cellular</text>
  <rect class="pill" x="268" y="394" width="96" height="32" rx="16"/>
  <text class="lab" x="316" y="407" text-anchor="middle">Cloudflare</text>
  <text class="lab" x="316" y="420" text-anchor="middle">quick tunnel</text>
  
  <line class="ar-dash" x1="364" y1="410" x2="398" y2="410" marker-start="url(#a)" marker-end="url(#a)"/>


  <!-- Ingest -->
  <rect class="bx" x="400" y="50" width="150" height="60" rx="3"/>
  <text class="code" x="412" y="72">nodes/water.py</text>
  <text class="t" x="412" y="92">serial reader thread</text>

  <rect class="bx" x="400" y="140" width="150" height="76" rx="3"/>
  <text class="code" x="412" y="162">nodes/aurora.py</text>
  <text class="t" x="412" y="181">runs aurora_bridge (C++)</text>
  <text class="t" x="412" y="198">raw BGR + depth (mm)</text>

  <rect class="bx" x="400" y="255" width="150" height="281" rx="3"/>
  <text class="code" x="412" y="277">nodes/ws_ingest.py</text>
  <text class="t" x="412" y="312">binary WS frames:</text>
  <text class="t" x="412" y="328">header JSON + JPEG</text>
  <text class="t" x="412" y="350">clock-offset pings</text>
  <text class="t" x="412" y="366">session + seq per node</text>
  <text class="t" x="412" y="388">rover and UAV proxy</text>
  <text class="t" x="412" y="404">share one protocol</text>
  <text class="code" x="412" y="500">nodes/sim.py</text>
  <text class="tm" x="412" y="517">SIM stand-in, any feed</text>

  <line class="ar" x1="550" y1="178" x2="588" y2="178" marker-end="url(#a)"/>
  <line class="ar" x1="550" y1="400" x2="588" y2="400" marker-end="url(#a)"/>
  <text class="lab" x="569" y="171" text-anchor="middle">frames</text>

  <!-- Perception -->
  <rect class="bx" x="590" y="140" width="140" height="456" rx="3"/>
  <text class="code" x="660" y="300" text-anchor="middle">perception/</text>
  <text class="tb" x="660" y="324" text-anchor="middle">Hailo-8</text>
  <text class="t" x="660" y="341" text-anchor="middle">yolov8s_h8</text>
  <text class="t" x="660" y="357" text-anchor="middle">person · sports ball</text>
  <text class="tb" x="660" y="386" text-anchor="middle">ballcolor HSV</text>
  <text class="t" x="660" y="403" text-anchor="middle">green = target</text>
  <text class="t" x="660" y="419" text-anchor="middle">red = decoy</text>
  <text class="tb" x="660" y="448" text-anchor="middle">IoU tracker</text>
  <text class="tm" x="660" y="474" text-anchor="middle">12–14 ms / frame</text>

  <!-- water → trigger (passes above perception) -->
  <line class="ar" x1="550" y1="80" x2="778" y2="80" marker-end="url(#a)"/>
  <text class="lab" x="665" y="73" text-anchor="middle">wet / dry</text>

  <!-- Decide column -->
  <rect class="bx" x="780" y="50" width="170" height="100" rx="3"/>
  <text class="code" x="792" y="70">overboard.py</text>
  <text class="tb" x="792" y="89">Auto-MOB trigger</text>
  <text class="t" x="792" y="107">armed: ball seen on deck</text>
  <text class="t" x="792" y="123">fires: ball out of view</text>
  <text class="t" x="792" y="139">≥ 0.5 s and sensor wet</text>
  <line class="ar" x1="730" y1="145" x2="778" y2="145" marker-end="url(#a)"/>
  <text class="lab" x="755" y="138" text-anchor="middle">deck ball</text>

  <line class="ar" x1="865" y1="150" x2="865" y2="178" marker-end="url(#a)"/>
  <text class="lab" x="872" y="168">opens incident</text>

  <rect class="bx" x="780" y="180" width="170" height="120" rx="3"/>
  <text class="code" x="792" y="200">incident.py</text>
  <text class="tb" x="792" y="219">Incident state machine</text>
  <text class="t" x="792" y="237">confirm · 50 m association</text>
  <text class="t" x="792" y="253">stale after 6.0 s</text>
  <text class="t" x="792" y="269">dedupe; never rewinds</text>
  <text class="t" x="792" y="285">manual MOB fallback</text>
  <line class="ar" x1="730" y1="240" x2="778" y2="240" marker-end="url(#a)"/>
  <text class="lab" x="755" y="233" text-anchor="middle">sightings</text>

  <line class="ar" x1="865" y1="302" x2="865" y2="328" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lab" x="874" y="319">seed ↓  area ↑</text>

  <rect class="bx" x="780" y="330" width="170" height="86" rx="3"/>
  <text class="code" x="792" y="350">drift.py · scenario.py</text>
  <text class="tb" x="792" y="369">Drift ESTIMATE (SIM)</text>
  <text class="t" x="792" y="387">leeway Monte Carlo, 60× clock</text>
  <text class="t" x="792" y="403">Open-Meteo wind + current</text>

  <path class="ar" d="M780,290 H757 V483 H778" marker-end="url(#a)"/>
  <text class="lab" x="752" y="430" text-anchor="end" transform="rotate(-90 752 430)">target to chase</text>

  <rect class="bx" x="780" y="450" width="170" height="66" rx="3"/>
  <text class="code" x="792" y="470">follow.py</text>
  <text class="tb" x="792" y="489">Rover commands</text>
  <text class="t" x="792" y="505">dispatch · follow err · stop</text>

  <path class="ar" d="M865,516 V628 H475 V538" marker-end="url(#a)"/>
  <text class="lab" x="670" y="621" text-anchor="middle">commands go back to the rover on the same WebSocket</text>

  <!-- Gateway + store -->
  <rect class="bx" x="990" y="180" width="120" height="200" rx="3"/>
  <text class="code" x="1002" y="200">gateway.py</text>
  <text class="tb" x="1002" y="219">Coordinator WS</text>
  <text class="t" x="1002" y="241">heartbeat 500 ms</text>
  <text class="t" x="1002" y="257">snapshot first,</text>
  <text class="t" x="1002" y="273">then history</text>
  <text class="t" x="1002" y="295">latest JPEG / node</text>
  <text class="t" x="1002" y="317">outage injector</text>
  <text class="tm" x="1002" y="333">(demo drawer, 5 s)</text>
  <line class="ar" x1="950" y1="220" x2="988" y2="220" marker-end="url(#a)"/>
  <text class="lab" x="969" y="213" text-anchor="middle">state</text>

  <path class="ar" d="M950,290 H970 V473 H988" marker-end="url(#a)"/>
  <text class="lab" x="984" y="400" text-anchor="middle" transform="rotate(-90 984 400)">events</text>

  <rect class="bx" x="990" y="430" width="120" height="86" rx="3"/>
  <text class="code" x="1002" y="450">store.py</text>
  <text class="tb" x="1002" y="469">SQLite log</text>
  <text class="t" x="1002" y="487">append-only events</text>
  <text class="t" x="1002" y="503">evidence JPEGs</text>
  <line class="ar" x1="1050" y1="430" x2="1050" y2="382" marker-end="url(#a)"/>
  <text class="lab" x="1057" y="410">history</text>

  <!-- Coordinator link: the outage boundary -->
  <line class="ar-acc" x1="1110" y1="240" x2="1196" y2="240" marker-end="url(#aa)"/>
  <text class="acc-t" x="1155" y="232" text-anchor="middle">WS · wired</text>
  <line class="ar-acc" x1="1198" y1="300" x2="1112" y2="300" marker-end="url(#aa)"/>
  <text class="acc-t" x="1155" y="292" text-anchor="middle">commands</text>
  <text class="lab" x="1155" y="317" text-anchor="middle">→ acks back</text>
  <text class="acc-t" x="1155" y="350" text-anchor="middle">pull cable =</text>
  <text class="acc-t" x="1155" y="364" text-anchor="middle">real outage</text>

  <text class="zt" x="1200" y="168">Coordinator</text>
  <rect class="bx-dev" x="1200" y="180" width="170" height="240" rx="4"/>
  <text class="tb" x="1214" y="203">Coordinator display</text>
  <text class="code" x="1214" y="221">web/app.js (Mac browser)</text>
  <text class="t" x="1214" y="247">LINK LOST after 1.5 s</text>
  <text class="t" x="1214" y="263">of silence; ages keep</text>
  <text class="t" x="1214" y="279">ticking locally</text>
  <text class="t" x="1214" y="301">feeds, chart, drift area</text>
  <text class="t" x="1214" y="323">Confirm · Not a person</text>
  <text class="t" x="1214" y="339">Stop following · End</text>
  <text class="tm" x="1214" y="365">169.254.50.2:8000</text>
  <text class="tm" x="1214" y="381">D = demo drawer</text>
</svg>
