[project]
name = "osprey"
version = "0.1.0"
description = "Man-overboard response under degraded comms (CodeMetal Forge 2026, Team 29)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6",
  "numpy>=1.26",
  "websockets>=12",
  "pillow>=10",
  "pyserial>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
