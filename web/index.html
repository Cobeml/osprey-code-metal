<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osprey MOB Coordinator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="ribbon">Link to ground processor lost — showing last received data</div>
<header id="banner" class="STANDBY">
  <div class="phase"><span class="dot">●</span> <span id="phase-text">CONNECTING…</span></div>
  <div id="subtitle">Waiting for the ground processor.</div>
  <div class="right">
    <span id="inc-timer"></span>
    <span id="link" class="pill">LINK …</span>
  </div>
</header>
<main>
  <section id="chart-wrap">
    <div id="chart"></div>
    <div id="estimate-label" class="hidden"></div>
    <div id="chart-note">Ship position simulated · deck-cam geometry real relative · scout coordinates simulated</div>
  </section>
  <section id="feeds">
    <div class="tile" data-node="ship"><div class="tile-head"><span class="name">SHIP DECK CAM</span><span class="pill">…</span></div><canvas width="640" height="400"></canvas><div class="age"></div></div>
    <div class="tile" data-node="A"><div class="tile-head"><span class="name">SCOUT A</span><span class="pill">…</span></div><canvas width="640" height="400"></canvas><div class="age"></div></div>
    <div class="tile" data-node="B"><div class="tile-head"><span class="name">SCOUT B</span><span class="pill">…</span></div><canvas width="640" height="400"></canvas><div class="age"></div></div>
  </section>
</main>
<footer>
  <div id="controls">
    <button id="btn-confirm" class="big green hidden">CONFIRM PERSON</button>
    <button id="btn-reject" class="hidden">Not a person</button>
    <button id="btn-follow" class="big hidden">STOP FOLLOWING</button>
    <button id="btn-end" class="big hidden">END INCIDENT</button>
    <span id="toast"></span>
  </div>
  <div id="timeline"></div>
  <div id="hint">D = demo</div>
</footer>
<aside id="drawer" class="hidden">
  <h3>Demo controls</h3>
  <button data-cmd="demo_start">Sim: crew member crosses rail</button>
  <button data-cmd="manual_mob">Manual MOB</button>
  <button data-cmd="demo_outage" data-args='{"seconds":5}'>Software outage 5 s</button>
  <button data-cmd="demo_hide" data-args='{"hidden":true}'>Sim: hide person</button>
  <button data-cmd="demo_hide" data-args='{"hidden":false}'>Sim: show person</button>
  <button data-cmd="demo_inject" data-args='{"dist_m":30}'>Reappear 30 m away</button>
  <button data-cmd="demo_inject" data-args='{"dist_m":80}'>Reappear 80 m away</button>
  <div class="row">Drift clock:
    <button data-cmd="demo_speed" data-args='{"multiplier":60}'>60×</button>
    <button data-cmd="demo_speed" data-args='{"multiplier":300}'>300×</button>
    <button data-cmd="demo_speed" data-args='{"multiplier":900}'>900×</button>
  </div>
  <div class="row">Sources:
    <button data-cmd="demo_source" data-args='{"node":"ship","source":"sim"}'>ship sim</button>
    <button data-cmd="demo_source" data-args='{"node":"ship","source":"aurora"}'>ship Aurora</button>
  </div>
  <div class="row">
    <button data-cmd="demo_source" data-args='{"node":"A","source":"sim"}'>A sim</button>
    <button data-cmd="demo_source" data-args='{"node":"A","source":"ws"}'>A real</button>
    <button data-cmd="demo_source" data-args='{"node":"B","source":"sim"}'>B sim</button>
    <button data-cmd="demo_source" data-args='{"node":"B","source":"ws"}'>B real</button>
  </div>
  <div id="stats"></div>
</aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
